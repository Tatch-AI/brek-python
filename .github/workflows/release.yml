name: Release
on:
  push:
    branches:
      - main
      - next
permissions:
  contents: write
  actions: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{github.ref}}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: npx autorel@^2
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Trigger PyPI publish workflow
        env:
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
          GITHUB_SHA: ${{github.sha}}
        run: |
          tag="$(gh api repos/Tatch-AI/brek-python/releases --jq ".[] | select(.target_commitish == \"${GITHUB_SHA}\") | .tag_name" | head -n 1)"
          if [ -z "$tag" ]; then
            echo "No release tag found for ${GITHUB_SHA}; skipping PyPI publish dispatch."
            exit 0
          fi
          gh workflow run pypi-publish.yml --repo Tatch-AI/brek-python -f release_tag="$tag"
