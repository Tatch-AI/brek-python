name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to publish
        required: true
        default: v0.0.2

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Align package version to release tag
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          path = Path("pyproject.toml")
          text = path.read_text()
          text = re.sub(r'^version = ".*"$', f'version = "{version}"', text, flags=re.M)
          path.write_text(text)
          PY
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}

      - name: Build wheel and sdist
        run: python -m build

      - name: Store built distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Retrieve built distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
