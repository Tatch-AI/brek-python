[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brek"
version = "0.0.1"
description = "Python port of brek, a structured config loader with layered files and loaders."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Sushant Vema" }
]
urls = { "Homepage" = "https://github.com/Tatch-AI/brek-python", "Repository" = "https://github.com/Tatch-AI/brek-python", "Issues" = "https://github.com/Tatch-AI/brek-python/issues" }
keywords = [
  "config",
  "configuration",
  "loader",
  "secrets",
  "aws",
  "python"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]

[project.scripts]
brek = "brek.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
